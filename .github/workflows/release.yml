name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main."
            exit 1
          fi

      - name: Check that the tag matches the plugin version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plugin_version="$(sed -n 's/^ \* Version: *//p' user-atlas.php)"
          stable_tag="$(sed -n 's/^Stable tag: *//p' readme.txt)"
          package_version="$(jq -r '.version' assets/package.json)"
          status=0
          for found in "user-atlas.php:$plugin_version" "readme.txt:$stable_tag" "assets/package.json:$package_version"; do
            if [ "$tag_version" != "${found#*:}" ]; then
              echo "Tag $GITHUB_REF_NAME does not match version ${found#*:} in ${found%%:*}."
              status=1
            fi
          done
          exit $status

      - name: Check that the changelog has a section for the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi

  checks:
    name: Checks
    needs: verify
    uses: ./.github/workflows/checks.yml

  build:
    name: Build
    needs: checks
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: user-atlas-zip
          path: dist

      - name: Extract the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/user-atlas.zip --title "User Atlas ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
