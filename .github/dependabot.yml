# Weekly update pull requests, grouped so that minor and patch updates come in one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /assets
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
